<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="300" cy="270" r="230" fill="url(#glow)"/>

  <!-- Subtle Dynamic Lines -->
  <path d="M0,460 Q300,380 600,480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,500 Q300,420 600,520" stroke="#F04423" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Main Product Graphic -->
  <g filter="url(#shadow)">
    
      <g transform="translate(150, 140)">
        <!-- Dual Crossed Rackets -->
        <ellipse cx="120" cy="90" rx="60" ry="75" fill="none" stroke="#F04423" stroke-width="8"/>
        <line x1="120" y1="165" x2="120" y2="260" stroke="#94A3B8" stroke-width="6"/>
        <rect x="114" y="240" width="12" height="50" rx="4" fill="#F04423"/>
        <!-- Feather Shuttlecock in Foreground -->
        <polygon points="190,180 230,130 250,140 210,190" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="190" cy="190" r="14" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      </g>
    
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 36)">
    <rect width="109.5" height="30" rx="15" fill="#F04423"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">BADMINTON</text>
  </g>

  <!-- Bottom Brand & Product Label -->
  <g transform="translate(36, 520)">
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">Shuttle Rackets</text>
    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFA08A">JAI SPORTS • OFFICIAL GEAR</text>
  </g>
</svg>