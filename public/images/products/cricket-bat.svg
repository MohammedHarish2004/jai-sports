<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F2212"/><stop offset="100%" stop-color="#1C0F08"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F04423"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sport Pattern Grid -->
  <circle cx="300" cy="270" r="228" fill="url(#glowGrad)"/>
  <path d="M0,450 Q300,360 600,510" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,491.99999999999994 Q300,402 600,552" stroke="#F04423" stroke-opacity="0.2" stroke-width="3" fill="none"/>

  <!-- Main Graphic -->
  <g filter="url(#cardShadow)">
    
      <!-- Premium Wood Bat -->
      <rect x="270" y="210" width="60" height="240" rx="14" fill="#D97706"/>
      <line x1="285" y1="210" x2="285" y2="450" stroke="#B45309" stroke-width="3"/>
      <line x1="300" y1="210" x2="300" y2="450" stroke="#B45309" stroke-width="3"/>
      <line x1="315" y1="210" x2="315" y2="450" stroke="#B45309" stroke-width="3"/>
      <!-- Handle -->
      <rect x="288" y="100" width="24" height="120" rx="8" fill="#F04423"/>
      <!-- Chevron Grip -->
      <line x1="288" y1="130" x2="312" y2="130" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="288" y1="150" x2="312" y2="150" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="288" y1="170" x2="312" y2="170" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="288" y1="190" x2="312" y2="190" stroke="#FFFFFF" stroke-width="2"/>
    
  </g>

  
  <!-- Sport Badge -->
  <g transform="translate(32, 32)">
    <rect width="157" height="28" rx="14" fill="#F04423" fill-opacity="0.95"/>
    <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">ENGLISH WILLOW</text>
  </g>
  
</svg>