<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/><stop offset="100%" stop-color="#3B1A05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="300" cy="270" r="230" fill="url(#glow)"/>

  <!-- Subtle Dynamic Lines -->
  <path d="M0,460 Q300,380 600,480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,500 Q300,420 600,520" stroke="#F04423" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Main Product Graphic -->
  <g filter="url(#shadow)">
    
      <g transform="translate(160, 140)">
        <!-- Square Wood Frame -->
        <rect x="15" y="15" width="250" height="250" rx="16" fill="#FDE68A" stroke="#78350F" stroke-width="22"/>
        <!-- Pockets -->
        <circle cx="34" cy="34" r="14" fill="#0F172A"/>
        <circle cx="246" cy="34" r="14" fill="#0F172A"/>
        <circle cx="34" cy="246" r="14" fill="#0F172A"/>
        <circle cx="246" cy="246" r="14" fill="#0F172A"/>
        <!-- Center Pattern -->
        <circle cx="140" cy="140" r="46" fill="none" stroke="#DC2626" stroke-width="4"/>
        <circle cx="140" cy="140" r="18" fill="#DC2626"/>
        <circle cx="140" cy="140" r="7" fill="#FDE68A"/>
        <!-- Carrom Baselines -->
        <line x1="60" y1="65" x2="220" y2="65" stroke="#B45309" stroke-width="3"/>
        <circle cx="60" cy="65" r="6" fill="#DC2626"/>
        <circle cx="220" cy="65" r="6" fill="#DC2626"/>
        <line x1="60" y1="215" x2="220" y2="215" stroke="#B45309" stroke-width="3"/>
        <circle cx="60" cy="215" r="6" fill="#DC2626"/>
        <circle cx="220" cy="215" r="6" fill="#DC2626"/>
        <!-- Striker Coin -->
        <circle cx="95" cy="160" r="18" fill="#F8FAFC" stroke="#2563EB" stroke-width="5"/>
        <!-- Black & White Carrommen -->
        <circle cx="155" cy="130" r="9" fill="#1E293B"/>
        <circle cx="130" cy="155" r="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
      </g>
    
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 36)">
    <rect width="138" height="30" rx="15" fill="#F04423"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">INDOOR GAMES</text>
  </g>

  <!-- Bottom Brand & Product Label -->
  <g transform="translate(36, 520)">
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">Carrom Boards</text>
    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFA08A">JAI SPORTS • OFFICIAL GEAR</text>
  </g>
</svg>