<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/><stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F04423"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sport Pattern Grid -->
  <circle cx="300" cy="270" r="228" fill="url(#glowGrad)"/>
  <path d="M0,450 Q300,360 600,510" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,491.99999999999994 Q300,402 600,552" stroke="#F04423" stroke-opacity="0.2" stroke-width="3" fill="none"/>

  <!-- Main Graphic -->
  <g filter="url(#cardShadow)">
    
      <!-- Backboard -->
      <rect x="190" y="150" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#F04423" stroke-width="10"/>
      <rect x="250" y="200" width="100" height="60" fill="none" stroke="#F04423" stroke-width="6"/>
      <!-- Rim & Net -->
      <rect x="260" y="260" width="80" height="16" rx="6" fill="#F04423"/>
      <polygon points="265,276 335,276 320,350 280,350" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4"/>
      <!-- Ball going in -->
      <circle cx="300" cy="220" r="35" fill="#EA580C"/>
    
  </g>

  
  <!-- Sport Badge -->
  <g transform="translate(32, 32)">
    <rect width="109.5" height="28" rx="14" fill="#F04423" fill-opacity="0.95"/>
    <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">MINI HOOP</text>
  </g>
  
</svg>