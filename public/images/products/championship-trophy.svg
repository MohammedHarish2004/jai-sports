<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F04423"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sport Pattern Grid -->
  <circle cx="300" cy="270" r="228" fill="url(#glowGrad)"/>
  <path d="M0,450 Q300,360 600,510" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,491.99999999999994 Q300,402 600,552" stroke="#F04423" stroke-opacity="0.2" stroke-width="3" fill="none"/>

  <!-- Main Graphic -->
  <g filter="url(#cardShadow)">
    
      <!-- Majestic Golden Cup -->
      <path d="M210,170 L390,170 C390,265 355,320 300,335 C245,320 210,265 210,170 Z" fill="url(#goldGrad)"/>
      <path d="M210,190 C150,190 150,270 220,290" stroke="url(#goldGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M390,190 C450,190 450,270 380,290" stroke="url(#goldGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
      <rect x="285" y="335" width="30" height="65" rx="4" fill="url(#goldGrad)"/>
      <rect x="220" y="400" width="160" height="50" rx="8" fill="#1E1B4B"/>
      <rect x="245" y="415" width="110" height="20" rx="4" fill="url(#goldGrad)"/>
      <polygon points="300,230 307,247 325,248 311,259 316,277 300,266 284,277 289,259 275,248 293,247" fill="#FFFFFF"/>
    
  </g>

  
  <!-- Sport Badge -->
  <g transform="translate(32, 32)">
    <rect width="138" height="28" rx="14" fill="#F04423" fill-opacity="0.95"/>
    <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">GRAND TROPHY</text>
  </g>
  
</svg>