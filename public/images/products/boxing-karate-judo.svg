<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A"/><stop offset="100%" stop-color="#180404"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="300" cy="270" r="230" fill="url(#glow)"/>

  <!-- Subtle Dynamic Lines -->
  <path d="M0,460 Q300,380 600,480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,500 Q300,420 600,520" stroke="#F04423" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Main Product Graphic -->
  <g filter="url(#shadow)">
    
      <g transform="translate(150, 130)">
        <!-- Heavy Boxing Glove Left -->
        <path d="M80,80 C80,45 125,35 155,50 C185,65 190,100 185,145 C180,180 155,200 120,200 L95,200 C80,200 80,175 80,150 Z" fill="#DC2626" stroke="#991B1B" stroke-width="6"/>
        <!-- Glove Cuff & Laces -->
        <rect x="85" y="200" width="55" height="35" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
        <line x1="95" y1="212" x2="130" y2="212" stroke="#DC2626" stroke-width="3"/>
        <line x1="95" y1="224" x2="130" y2="224" stroke="#DC2626" stroke-width="3"/>
        <!-- Black Belt & Karate Gi Knot -->
        <path d="M145,170 Q195,145 235,185 L225,255 L190,210 L170,265 Z" fill="#18181B" stroke="#3F3F46" stroke-width="4"/>
        <!-- Karate Ribbon / Gold Emblem -->
        <circle cx="215" cy="115" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
        <path d="M205,108 L215,98 L225,108 L220,128 L210,128 Z" fill="#FFFFFF"/>
      </g>
    
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 36)">
    <rect width="147.5" height="30" rx="15" fill="#F04423"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">COMBAT SPORTS</text>
  </g>

  <!-- Bottom Brand & Product Label -->
  <g transform="translate(36, 520)">
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">Boxing , Karate and Judo</text>
    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFA08A">JAI SPORTS • OFFICIAL GEAR</text>
  </g>
</svg>