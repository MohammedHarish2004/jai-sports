<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142159"/><stop offset="100%" stop-color="#0A1132"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="300" cy="270" r="230" fill="url(#glow)"/>

  <!-- Subtle Dynamic Lines -->
  <path d="M0,460 Q300,380 600,480" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,500 Q300,420 600,520" stroke="#F04423" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Main Product Graphic -->
  <g filter="url(#shadow)">
    
      <!-- Bat & Ball & Wickets -->
      <g transform="translate(240, 140)">
        <!-- Wickets -->
        <rect x="50" y="80" width="12" height="180" rx="4" fill="#D97706"/>
        <rect x="75" y="80" width="12" height="180" rx="4" fill="#D97706"/>
        <rect x="100" y="80" width="12" height="180" rx="4" fill="#D97706"/>
        <rect x="42" y="70" width="78" height="10" rx="3" fill="#D97706"/>
        <!-- Angled Bat -->
        <g transform="rotate(-30 60 120)">
          <rect x="40" y="30" width="36" height="190" rx="10" fill="#F59E0B"/>
          <rect x="48" y="-40" width="18" height="75" rx="8" fill="#F04423"/>
        </g>
        <!-- Red Ball in Front -->
        <circle cx="130" cy="230" r="42" fill="#DC2626" stroke="#FFFFFF" stroke-width="4"/>
        <path d="M102,230 C114,212 146,212 158,230 C146,248 114,248 102,230" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4,3" fill="none"/>
      </g>
    
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 36)">
    <rect width="185.5" height="30" rx="15" fill="#F04423"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CRICKET EQUIPMENT</text>
  </g>

  <!-- Bottom Brand & Product Label -->
  <g transform="translate(36, 520)">
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">Cricket</text>
    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFA08A">JAI SPORTS • OFFICIAL GEAR</text>
  </g>
</svg>