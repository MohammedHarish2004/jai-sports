<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/><stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#F04423"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sport Pattern Grid -->
  <circle cx="300" cy="270" r="228" fill="url(#glowGrad)"/>
  <path d="M0,450 Q300,360 600,510" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" fill="none"/>
  <path d="M0,491.99999999999994 Q300,402 600,552" stroke="#F04423" stroke-opacity="0.2" stroke-width="3" fill="none"/>

  <!-- Main Graphic -->
  <g filter="url(#cardShadow)">
    
      <!-- Cast Iron Pair -->
      <rect x="160" y="280" width="280" height="36" rx="8" fill="#CBD5E1"/>
      <!-- Hex Plates Left -->
      <polygon points="140,210 170,210 185,255 185,345 170,390 140,390 125,345 125,255" fill="#F04423"/>
      <!-- Hex Plates Right -->
      <polygon points="430,210 460,210 475,255 475,345 460,390 430,390 415,345 415,255" fill="#F04423"/>
      <!-- Texture lines on grip -->
      <line x1="240" y1="280" x2="240" y2="316" stroke="#475569" stroke-width="4"/>
      <line x1="270" y1="280" x2="270" y2="316" stroke="#475569" stroke-width="4"/>
      <line x1="300" y1="280" x2="300" y2="316" stroke="#475569" stroke-width="4"/>
      <line x1="330" y1="280" x2="330" y2="316" stroke="#475569" stroke-width="4"/>
      <line x1="360" y1="280" x2="360" y2="316" stroke="#475569" stroke-width="4"/>
    
  </g>

  
  <!-- Sport Badge -->
  <g transform="translate(32, 32)">
    <rect width="147.5" height="28" rx="14" fill="#F04423" fill-opacity="0.95"/>
    <text x="12" y="19" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">STRENGTH GEAR</text>
  </g>
  
</svg>