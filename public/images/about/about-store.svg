<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B4B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="abShadow">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" rx="32" fill="url(#aboutBg)"/>
  <circle cx="400" cy="300" r="220" fill="#F04423" fill-opacity="0.12"/>
  <g filter="url(#abShadow)" transform="translate(100, 80)">
    <!-- Storefront Showcase -->
    <rect x="50" y="120" width="500" height="260" rx="20" fill="#FFFFFF"/>
    <!-- Glass Display Front -->
    <rect x="70" y="140" width="460" height="220" rx="12" fill="#F8FAFC"/>
    <!-- Canopy in Navy and Orange -->
    <path d="M40,120 L560,120 L540,70 L60,70 Z" fill="#101B4B"/>
    <path d="M100,120 L160,120 L150,70 L110,70 Z" fill="#F04423"/>
    <path d="M220,120 L280,120 L270,70 L230,70 Z" fill="#F04423"/>
    <path d="M340,120 L400,120 L390,70 L350,70 Z" fill="#F04423"/>
    <path d="M460,120 L520,120 L510,70 L470,70 Z" fill="#F04423"/>
    <!-- Signboard -->
    <rect x="180" y="25" width="240" height="50" rx="10" fill="#F04423"/>
    <text x="300" y="58" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JAI SPORTS</text>
    <!-- Shelves with Trophies & Balls -->
    <line x1="90" y1="240" x2="510" y2="240" stroke="#CBD5E1" stroke-width="6"/>
    <line x1="90" y1="310" x2="510" y2="310" stroke="#CBD5E1" stroke-width="6"/>
    <!-- Shelf Items -->
    <circle cx="150" cy="215" r="20" fill="#F04423"/>
    <circle cx="210" cy="215" r="18" fill="#101B4B"/>
    <rect x="270" y="185" width="40" height="50" rx="6" fill="#F59E0B"/>
    <rect x="340" y="175" width="50" height="60" rx="8" fill="#F59E0B"/>
    <circle cx="430" cy="215" r="20" fill="#10B981"/>
    <!-- Lower shelf -->
    <rect x="130" y="270" width="80" height="35" rx="6" fill="#3B82F6"/>
    <rect x="240" y="270" width="90" height="35" rx="6" fill="#EF4444"/>
    <rect x="360" y="270" width="100" height="35" rx="6" fill="#101B4B"/>
  </g>
</svg>