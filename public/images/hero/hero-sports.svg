<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B4B"/>
      <stop offset="60%" stop-color="#172568"/>
      <stop offset="100%" stop-color="#0A1132"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F04423" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#101B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="800" rx="36" fill="url(#heroBg)"/>
  <circle cx="650" cy="400" r="320" fill="url(#sunGlow)"/>

  <!-- Dynamic Speed Slanted Stripes -->
  <polygon points="520,0 600,0 420,800 340,800" fill="#FFFFFF" fill-opacity="0.04"/>
  <polygon points="630,0 730,0 550,800 450,800" fill="#F04423" fill-opacity="0.15"/>
  <polygon points="760,0 840,0 660,800 580,800" fill="#FFFFFF" fill-opacity="0.03"/>

  <!-- Hero Trophy Composition -->
  <g filter="url(#hShadow)">
    <!-- Golden Championship Trophy Center -->
    <path d="M540,240 L760,240 C760,360 720,430 650,450 C580,430 540,360 540,240 Z" fill="url(#goldH)"/>
    <path d="M540,270 C470,270 470,370 550,390" stroke="url(#goldH)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M760,270 C830,270 830,370 750,390" stroke="url(#goldH)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <rect x="630" y="450" width="40" height="80" rx="6" fill="url(#goldH)"/>
    <rect x="550" y="530" width="200" height="60" rx="12" fill="#18181B"/>
    <rect x="580" y="550" width="140" height="24" rx="4" fill="url(#goldH)"/>
    <!-- Star on Trophy -->
    <polygon points="650,310 658,328 678,330 663,342 668,362 650,350 632,362 637,342 622,330 642,328" fill="#FFFFFF"/>

    <!-- Football In Foreground -->
    <g transform="translate(430, 480)">
      <circle cx="80" cy="80" r="75" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
      <polygon points="80,55 98,68 91,89 69,89 62,68" fill="#F04423"/>
      <path d="M80,55 L80,25 M98,68 L125,60 M91,89 L110,115 M69,89 L50,115 M62,68 L35,60" stroke="#0F172A" stroke-width="4.5"/>
    </g>

    <!-- Cricket Bat Angled -->
    <g transform="translate(720, 360) rotate(25)">
      <rect x="0" y="40" width="38" height="180" rx="10" fill="#D97706"/>
      <rect x="11" y="-30" width="16" height="70" rx="6" fill="#F04423"/>
      <!-- Grips -->
      <line x1="11" y1="-10" x2="27" y2="-10" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="11" y1="10" x2="27" y2="10" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- Floating Stats Badges -->
  <g transform="translate(180, 520)" filter="url(#hShadow)">
    <rect width="220" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="45" cy="40" r="24" fill="#FFF1EE"/>
    <text x="45" y="48" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#F04423" text-anchor="middle">★</text>
    <text x="85" y="36" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#101B4B">100% Genuine</text>
    <text x="85" y="56" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#64748B">Sports Gear & Cups</text>
  </g>

  <g transform="translate(680, 150)" filter="url(#hShadow)">
    <rect width="210" height="74" rx="16" fill="#F04423"/>
    <circle cx="40" cy="37" r="20" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="40" y="44" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">⚡</text>
    <text x="75" y="34" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Direct WhatsApp</text>
    <text x="75" y="52" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#FFE4DE">Instant Quotations</text>
  </g>
</svg>